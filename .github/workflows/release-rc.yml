name: StarChat Windows V1 RC

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: code
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test manifest
        run: pnpm run verify:test-manifest
      - name: Test regular suite
        run: pnpm exec vitest run --exclude=src/main/git-runner.test.ts --exclude=src/main/brand-migration.test.ts
      - name: Test Git runner suite
        run: pnpm exec vitest run src/main/git-runner.test.ts
      - name: Test brand migration suite
        run: pnpm exec vitest run src/main/brand-migration.test.ts
      - name: Build Windows portable package
        run: pnpm run package:win
      - name: Prepare release manifest
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $source = Join-Path $env:GITHUB_WORKSPACE "outputs\StarChat $version.exe"
          if (-not (Test-Path -LiteralPath $source)) { throw "portable EXE not found: $source" }
          $releaseName = "StarChat-$version-win-x64-portable.exe"
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE "release"
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null
          $releasePath = Join-Path $releaseRoot $releaseName
          Copy-Item -LiteralPath $source -Destination $releasePath -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $releasePath).Hash.ToLowerInvariant()
          "$hash  $releaseName" | Set-Content -LiteralPath (Join-Path $releaseRoot "SHA256SUMS.txt") -Encoding utf8
          [ordered]@{
            version = $version
            platform = "win32"
            arch = "x64"
            artifact = $releaseName
            sha256 = $hash
            signed = $false
            commit = $env:RELEASE_COMMIT
            ciRunId = $env:RELEASE_RUN_ID
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $releaseRoot "release-manifest.json") -Encoding utf8
          Get-ChildItem -LiteralPath $releaseRoot | Select-Object Name,Length
      - name: Upload Windows RC artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarChat-windows-v1-rc
          path: release
          if-no-files-found: error
